apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/imeshsen/k8s-gitops-platform.git'
    targetRevision: HEAD
    path: helm/backend
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: k8s
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
