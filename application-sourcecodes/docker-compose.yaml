services:
  backend:
    build:
      context: "./backend"
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

  frontend:
    build:
      context: "./frontend"
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"

networks:
  default:
    name: app-network
    driver: bridge
